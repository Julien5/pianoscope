[package]
name = "rust_lib_frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
log = "0.4"
backend = { version = "*", path = "../../backend" }
chrono = "0.4.45"
env_logger = "0.11.11"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
