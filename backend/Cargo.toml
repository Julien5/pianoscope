[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
midir = { git = "https://github.com/Boddlnagg/midir", rev = "8d00b6f68b4b76922a3e7d5a518adff846092c8c" }
ndk-context = "0.1.1"
log = "0.4"
cpal = "0.18"
rtrb = "0.3"
hound = "3"
zeromq = "0.4"
tokio = { version = "1", features = ["full"] }
bytemuck = "1" # Safely converts &[f32] audio buffer to &[u8]
env_logger = "0.11.8"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "deflate", "rustls-tls", "multipart"] }
tokio-util = "0.7"
mcleod = { git = "https://github.com/Julien5/mcleod.git" }
rustfft = "6"

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "0.21"

